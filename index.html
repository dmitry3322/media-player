<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Music WebApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <h2 class="title">Медиатека</h2>
    <div id="tracks"></div>
  </div>

  <div class="player-bar">
    <button id="playerPlayPause" class="player-btn">▶</button>

    <div class="player-info">
      <div id="playerTitle" class="player-title">Ничего не играет</div>
      <div id="playerArtist" class="player-artist"></div>
      <input id="playerProgress" class="player-progress" type="range" min="0" max="100" value="0" />
    </div>

    <audio id="audio"></audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
