<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Media Player</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div id="tracks"></div>

  <div id="player">
    <div id="playerTitle">Ничего не играет</div>
    <div id="playerArtist"></div>

    <div id="playerControls">
      <button id="playerPlayPause">▶</button>
      <input type="range" id="playerProgress" value="0">
    </div>

    <audio id="audio"></audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
