<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOT FRIEND Media</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #1e1e24;
            --card: #282830;
            --text: #e0e0e0;
            --sub: #999;
            --accent: #0A4637;
            --active: #0d5a47;
            --border: #333;
            --batch-bg: #22222a;
        }

        body.light-theme {
            --bg: #f4f4f7;
            --card: #ffffff;
            --text: #1c1c1f;
            --sub: #6e6e77;
            --border: #e4e4e7;
            --batch-bg: #e4e4e7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; display: flex; flex-direction: column;
            user-select: none; -webkit-tap-highlight-color: transparent;
            padding-bottom: 80px; /* Отступ снизу, чтобы мини-плеер не перекрывал список */
            transition: background 0.2s;
            overflow: hidden;
        }
        
        .header { padding: 16px; background: #222; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        body.light-theme .header { background: #e4e4e7; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .header-title-block { display: flex; align-items: center; gap: 8px; }
        .header h1 { font-size: 20px; font-weight: 600; color: #fff; }
        body.light-theme .header h1 { color: #1c1c1f; }
        
        .ping-indicator { width: 8px; height: 8px; background-color: #ff3b30; border-radius: 50%; display: inline-block; transition: background-color 0.3s; }
        .ping-indicator.online { background-color: #4cd964; }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .action-icon-btn {
            background: #2a2a2a; border: 1px solid var(--border); color: #fff;
            cursor: pointer; width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        body.light-theme .action-icon-btn { background: #ffffff; color: #1c1c1f; border-color: #ccc; }
        .action-icon-btn:active { opacity: 0.7; }

        .top-play-btn {
            background: var(--accent); color: #fff; padding: 8px 14px;
            border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer;
        }

        .search-box {
            width: 100%; padding: 12px 14px; border-radius: 12px;
            border: 1px solid var(--border); background: #2a2a2a;
            color: var(--text); font-size: 15px; outline: none;
        }
        body.light-theme .search-box { background: #ffffff; color: #1c1c1f; }
        
        .tabs { display: flex; gap: 6px; padding: 10px 16px; background: #222; border-bottom: 1px solid var(--border); }
        body.light-theme .tabs { background: #e4e4e7; }
        .tab {
            flex: 1; padding: 12px 6px; border-radius: 10px; border: none;
            background: #2a2a2a; color: var(--sub); font-size: 12px;
            font-weight: 500; cursor: pointer; text-align: center;
        }
        body.light-theme .tab { background: #ffffff; }
        .tab.active { background: var(--accent); color: #fff; }
        
        .track-list { flex: 1; overflow-y: auto; padding: 8px 16px; }
        
        .track-item {
            display: flex; align-items: center; padding: 14px 12px;
            border-radius: 15px; background: var(--card); margin-bottom: 8px; gap: 12px;
            border: 1px solid var(--accent); position: relative;
        }
        
        .track-checkbox { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
        .track-icon { font-size: 24px; }
        .track-info { flex: 1; min-width: 0; }
        .track-title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 13px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; }
        
        .track-controls { display: flex; align-items: center; gap: 14px; }
        
        .heart-icon { font-size: 18px; cursor: pointer; color: var(--sub); user-select: none; transition: color 0.2s; }
        .heart-icon.active { color: #ff3b30; }
        
        .btn { padding: 10px 14px; border-radius: 10px; border: none; cursor: pointer; }
        .btn-play { background: var(--accent); color: #fff; }
        .empty { text-align: center; padding: 40px; color: var(--sub); }

        /* === КРАСИВЫЙ МИНИ-ПЛЕЕР (СТАТУС: ПЛАВАЕТ СНИЗУ) === */
        .mini-player {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 2000;
            cursor: pointer;
            height: 65px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
        }

        /* Тонкая линия прогресса на самом верху мини-плеера */
        .mini-progress-bar {
            position: absolute;
            top: 0; left: 0; width: 0%; height: 3px;
            background: var(--accent);
            transition: width 0.1s linear;
        }

        .mini-info { flex: 1; min-width: 0; }
        .mini-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-artist { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .mini-controls { display: flex; align-items: center; gap: 16px; }
        .mini-ctrl-btn { background: none; border: none; color: var(--text); font-size: 18px; cursor: pointer; }
        .mini-ctrl-btn:active { opacity: 0.5; }

        /* === ПОЛНОЭКРАННЫЙ ПЛЕЕР (ШТОРКА) === */
        .full-player {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            padding: 24px;
            transform: translateY(100%); /* Изначально спрятан внизу за экраном */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.125); /* Плавный выезд */
        }

        .full-player.active {
            transform: translateY(0); /* Показываем шторку */
        }

        .full-close-btn { background: none; border: none; color: var(--sub); font-size: 28px; align-self: center; cursor: pointer; padding: 10px; }
        
        .full-cover-area {
            flex: 1; display: flex; align-items: center; justify-content: center;
        }
        .full-vinyl {
            width: 200px; height: 200px; background: var(--card); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 80px;
            border: 4px solid var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .full-meta { text-align: center; margin-bottom: 20px; }
        .full-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .full-artist { font-size: 16px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Таймлайн и время */
        .timeline-container { display: flex; flex-direction: column; gap: 6px; margin-bottom: 25px; }
        .timeline-slider {
            width: 100%; height: 5px; background: #444; border-radius: 3px;
            outline: none; -webkit-appearance: none; accent-color: var(--accent);
        }
        .time-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); }

        /* Кнопки управления главным окном */
        .full-controls { display: flex; justify-content: center; align-items: center; gap: 32px; margin-bottom: 30px; }
        .full-btn { background: none; border: none; color: var(--text); font-size: 26px; cursor: pointer; }
        .full-btn-main { background: var(--accent); color: #fff; width: 64px; height: 64px; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; }
        .full-btn:active, .full-btn-main:active { opacity: 0.7; }

        /* Доп. функции: перемешать и повтор */
        .full-extra-controls { display: flex; justify-content: space-around; padding: 0 20px; }
        .extra-btn { background: none; border: none; color: var(--sub); font-size: 20px; cursor: pointer; transition: color 0.2s; }
        .extra-btn.active { color: var(--accent); text-shadow: 0 0 8px var(--accent); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <div class="header-title-block">
                <span class="ping-indicator" id="pingDot"></span>
                <h1>🎬 BOT FRIEND</h1>
            </div>

            <div class="header-actions">
                <button class="action-icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <button class="action-icon-btn" onclick="location.reload()">↻</button>
                <button class="top-play-btn" onclick="sendSelectedBatch()">▶ Выбранные</button>
            </div>
        </div>

        <input type="text" class="search-box" placeholder="🔍 Поиск..." oninput="filterTracks()">
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('all')">Все</button>
        <button class="tab" onclick="switchTab('audio')">🎧 Аудио</button>
        <button class="tab" onclick="switchTab('video')">🎬 Клипы</button>
        <button class="tab" onclick="switchTab('fav')">❤️ Избранное</button>
    </div>

    <div class="track-list" id="trackList"><div class="empty">Загрузка...</div></div>

    <audio id="mainAudio"></audio>

    <div class="mini-player" id="miniPlayer" style="display:none;" onclick="openFullPlayer(event)">
        <div class="mini-progress-bar" id="miniProgress"></div>
        <div class="mini-info">
            <div class="mini-title" id="miniTitle">Название песни</div>
            <div class="mini-artist" id="miniArtist">Исполнитель</div>
        </div>
        <div class="mini-controls">
            <button class="mini-ctrl-btn" onclick="playPrev(event)">⏮</button>
            <button class="mini-ctrl-btn" onclick="togglePlay(event)" id="miniPlayBtn">⏸</button>
            <button class="mini-ctrl-btn" onclick="playNext(event)">⏭</button>
        </div>
    </div>

    <div class="full-player" id="fullPlayer">
        <button class="full-close-btn" onclick="closeFullPlayer()">🔽</button>
        
        <div class="full-cover-area">
            <div class="full-vinyl" id="fullIcon">🎧</div>
        </div>

        <div class="full-meta">
            <div class="full-title" id="fullTitle">Название песни</div>
            <div class="full-artist" id="fullArtist">Исполнитель</div>
        </div>

        <div class="timeline-container">
            <input type="range" class="timeline-slider" id="timeline" min="0" max="100" value="0" oninput="onTimelineInput()" onchange="onTimelineChange()">
            <div class="time-info">
                <span id="timeCurrent">0:00</span>
                <span id="timeTotal">0:00</span>
            </div>
        </div>

        <div class="full-controls">
            <button class="full-btn" onclick="playPrev(event)">⏮</button>
            <button class="full-btn-main" onclick="togglePlay(event)" id="fullPlayBtn">⏸</button>
            <button class="full-btn" onclick="playNext(event)">⏭</button>
        </div>

        <div class="full-extra-controls">
            <button class="extra-btn" id="shuffleBtn" onclick="toggleShuffle()">🔀</button>
            <button class="extra-btn" id="repeatBtn" onclick="toggleRepeat()">🔁</button>
        </div>
    </div>

    <script>
        let allTracks = [];
        let currentPlaylist = []; // Текущий отфильтрованный список для переключения треков
        let currentTrackIndex = -1;
        
        let isShuffle = false;
        let isRepeat = false; // false = нет, true = зациклить один трек
        let isSeeking = false;

        let currentTab = 'all';
        let favoriteIds = JSON.parse(localStorage.getItem('fav_tracks')) || [];
        const tg = window.Telegram.WebApp;
        tg.expand();

        const audio = document.getElementById('mainAudio');

        setTimeout(() => { document.getElementById('pingDot').classList.add('online'); }, 600);

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const btn = document.getElementById('themeBtn');
            btn.innerText = document.body.classList.contains('light-theme') ? '☀️' : '🌙';
        }

        // Загружаем твой music_list.json
        fetch('https://dmitry3322.github.io/media-player/music_list.json')
            .then(r => r.json())
            .then(data => { allTracks = data || []; renderTracks(); })
            .catch(() => {
                document.getElementById('trackList').innerHTML = '<div class="empty">Файл music_list.json не найден</div>';
            });

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const tabs = document.querySelectorAll('.tab');
            if (tab === 'all') tabs[0].classList.add('active');
            else if (tab === 'audio') tabs[1].classList.add('active');
            else if (tab === 'video') tabs[2].classList.add('active');
            else if (tab === 'fav') tabs[3].classList.add('active');
            renderTracks();
        }

        function filterTracks() {
            const query = document.querySelector('.search-box').value.toLowerCase();
            renderTracks(query);
        }

        function toggleFavClick(element, trackId) {
            element.classList.toggle('active');
            if (element.classList.contains('active')) {
                if (!favoriteIds.includes(trackId)) favoriteIds.push(trackId);
            } else {
                favoriteIds = favoriteIds.filter(id => id !== trackId);
            }
            localStorage.setItem('fav_tracks', JSON.stringify(favoriteIds));
            
            if (currentTab === 'fav') {
                renderTracks();
            }
        }

        function renderTracks(query = '') {
            let filtered = allTracks;
            
            if (currentTab === 'audio') filtered = filtered.filter(t => t.file_type === 'audio');
            if (currentTab === 'video') filtered = filtered.filter(t => t.file_type === 'video');
            if (currentTab === 'fav') filtered = filtered.filter(t => favoriteIds.includes(t.id));
            
            if (query) {
                filtered = filtered.filter(t => 
                    (t.artist + " " + t.title).toLowerCase().includes(query)
                );
            }

            currentPlaylist = filtered; // Обновляем рабочий плейлист

            const container = document.getElementById('trackList');
            container.innerHTML = filtered.length ? '' : '<div class="empty">Ничего не найдено</div>';
            
            filtered.forEach(t => {
                const isLiked = favoriteIds.includes(t.id) ? 'active' : '';
                const div = document.createElement('div');
                div.className = 'track-item';
                div.setAttribute('data-id', t.id);
                div.innerHTML = `
                    <input type="checkbox" class="track-checkbox" onchange="handleCheckboxChange()">
                    <div class="track-icon">${t.file_type === 'audio' ? '🎧' : '🎬'}</div>
                    <div class="track-info">
                        <div class="track-title">${t.title || 'Без названия'}</div>
                        <div class="track-artist">${t.artist || 'Неизвестен'}</div>
                    </div>
                    <div class="track-controls">
                        <span class="heart-icon ${isLiked}" onclick="toggleFavClick(this, ${t.id}); event.stopPropagation();">♥</span>
                        <button class="btn btn-play" onclick="startPlay(${t.id}); event.stopPropagation();">▶</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function handleCheckboxChange() {
            // Оставили старую логику чекбоксов для массового выбора, если понадобится
        }

        /* === НОВАЯ ПОЛНОЦЕННАЯ ЛОГИКА ПЛЕЕРА === */

        function startPlay(id) {
            const index = currentPlaylist.findIndex(t => t.id === id);
            if (index === -1) return;

            currentTrackIndex = index;
            const track = currentPlaylist[currentTrackIndex];

            if (!track.url) {
                alert("У этого трека нет ссылки для проигрывания");
                return;
            }

            audio.src = track.url;
            audio.play();

            updatePlayerUI(track);
            document.getElementById('miniPlayer').style.display = "flex";
        }

        function updatePlayerUI(track) {
            // Обновляем тексты в мини-плеере
            document.getElementById('miniTitle').innerText = track.title || 'Без названия';
            document.getElementById('miniArtist').innerText = track.artist || 'Неизвестен';
            
            // Обновляем тексты в шторке большого плеера
            document.getElementById('fullTitle').innerText = track.title || 'Без названия';
            document.getElementById('fullArtist').innerText = track.artist || 'Неизвестен';
            document.getElementById('fullIcon').innerText = track.file_type === 'audio' ? '🎧' : '🎬';

            // Переключаем кнопки в режим Паузы
            document.getElementById('miniPlayBtn').innerText = "⏸";
            document.getElementById('fullPlayBtn').innerText = "⏸";
        }

        function togglePlay(event) {
            if (event) event.stopPropagation(); // Чтобы при клике на паузу в мини-плеере не выезжала шторка
            if (!audio.src) return;

            if (audio.paused) {
                audio.play();
                document.getElementById('miniPlayBtn').innerText = "⏸";
                document.getElementById('fullPlayBtn').innerText = "⏸";
            } else {
                audio.pause();
                document.getElementById('miniPlayBtn').innerText = "▶";
                document.getElementById('fullPlayBtn').innerText = "▶";
            }
        }

        function playNext(event) {
            if (event) event.stopPropagation();
            if (currentPlaylist.length === 0) return;

            if (isShuffle) {
                currentTrackIndex = Math.floor(Math.random() * currentPlaylist.length);
            } else {
                currentTrackIndex = (currentTrackIndex + 1) % currentPlaylist.length;
            }

            const nextTrack = currentPlaylist[currentTrackIndex];
            startPlay(nextTrack.id);
        }

        function playPrev(event) {
            if (event) event.stopPropagation();
            if (currentPlaylist.length === 0) return;

            currentTrackIndex = (currentTrackIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            const prevTrack = currentPlaylist[currentTrackIndex];
            startPlay(prevTrack.id);
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('repeatBtn').classList.toggle('active', isRepeat);
        }

        /* === УПРАВЛЕНИЕ ШТОРКОЙ === */
        function openFullPlayer(event) {
            // Открываем шторку только если кликнули по телу мини-плеера, а не по его кнопкам управления
            if (!event.target.classList.contains('mini-ctrl-btn')) {
                document.getElementById('fullPlayer').classList.add('active');
            }
        }

        function closeFullPlayer() {
            document.getElementById('fullPlayer').classList.remove('active');
        }

        /* === ТАЙМЛАЙН, ОБНОВЛЕНИЕ ВРЕМЕНИ И ПОЛОСЫ ПРОГРЕССА === */
        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;

            // Двигаем прогресс-бар мини-плеера
            const progressPercent = (audio.currentTime / audio.duration) * 100;
            document.getElementById('miniProgress').style.width = `${progressPercent}%`;

            // Если пользователь не тянет ползунок прямо сейчас, обновляем большой плеер
            if (!isSeeking) {
                document.getElementById('timeline').value = progressPercent;
                document.getElementById('timeCurrent').innerText = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            document.getElementById('timeTotal').innerText = formatTime(audio.duration);
        });

        // Когда трек закончился
        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play();
            } else {
                playNext();
            }
        });

        function onTimelineInput() {
            isSeeking = true;
        }

        function onTimelineChange() {
            if (!audio.duration) return;
            const slider = document.getElementById('timeline');
            audio.currentTime = (slider.value / 100) * audio.duration;
            isSeeking = false;
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function sendSelectedBatch() {
            const checkboxes = document.querySelectorAll('.track-checkbox');
            let selectedIds = [];
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    const item = cb.closest('.track-item');
                    selectedIds.push(parseInt(item.getAttribute('data-id')));
                }
            });
            if (selectedIds.length > 0) {
                tg.sendData(JSON.stringify({action: "play_batch", ids: selectedIds}));
                tg.close();
            }
        }
    </script>
</body>
</html>
