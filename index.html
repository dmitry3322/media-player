<script>
    const TAG_ICONS = {"рок":"🎸","поп":"🎤","club":"🎧","рэп":"🧢","русское":"🇷🇺","зарубежное":"🇬🇧","90-е":"🕰️"};
    let allTracks=[], cloudResults=[], currentPlaylist=[], currentTrackIndex=-1, currentTrackId=null, currentTag='all', searchMode='local';
    let isShuffle=false, isRepeat=false, isSeeking=false, currentTab='all';
    let favoriteIds=JSON.parse(localStorage.getItem('fav_tracks')||'[]');
    let s3Cache = null; // Кэш списка всех файлов из облака
    const tg=window.Telegram.WebApp; tg.expand();
    const audio=document.getElementById('mainAudio');
    let eqInterval=null, miniEqInterval=null;
    const BUCKET_URL = "https://s3.twcstorage.ru/f63a7b4b-c769-4832-98b1-41f5b1e1bd11";
    
    setTimeout(()=>{document.getElementById('pingDot').classList.add('online')},600);
    audio.onerror=()=>playNext();

    function startMainEqAnimation(){if(eqInterval)clearInterval(eqInterval);const bars=document.querySelectorAll('.eq-bar-main');eqInterval=setInterval(()=>{bars.forEach(bar=>{bar.style.height=Math.floor(Math.random()*30+5)+'px'})},150)}
    function stopMainEqAnimation(){if(eqInterval)clearInterval(eqInterval);document.querySelectorAll('.eq-bar-main').forEach(bar=>bar.style.height='4px')}
    function startMiniEqAnimation(trackId){stopMiniEqAnimation();const item=document.querySelector(`.track-item[data-id="${trackId}"]`);if(!item)return;const playBtn=item.querySelector('.btn-play'),miniEq=item.querySelector('.mini-eq');if(playBtn)playBtn.classList.add('hidden');if(miniEq){miniEq.classList.add('active');const bars=miniEq.querySelectorAll('.eq-bar');miniEqInterval=setInterval(()=>{bars.forEach(bar=>{bar.style.height=Math.floor(Math.random()*14+4)+'px'})},180)}}
    function stopMiniEqAnimation(){if(miniEqInterval)clearInterval(miniEqInterval);document.querySelectorAll('.mini-eq.active').forEach(eq=>{eq.classList.remove('active');const item=eq.closest('.track-item');if(item){const playBtn=item.querySelector('.btn-play');if(playBtn)playBtn.classList.remove('hidden')}});document.querySelectorAll('.track-item.now-playing').forEach(el=>el.classList.remove('now-playing'))}
    function highlightCurrentTrack(trackId){document.querySelectorAll('.track-item.now-playing').forEach(el=>el.classList.remove('now-playing'));const item=document.querySelector(`.track-item[data-id="${trackId}"]`);if(item)item.classList.add('now-playing')}
    audio.onplay=()=>{document.getElementById('fullIcon').classList.add('playing');startMainEqAnimation();if(currentTrackId){startMiniEqAnimation(currentTrackId);highlightCurrentTrack(currentTrackId)}};
    audio.onpause=()=>{document.getElementById('fullIcon').classList.remove('playing');stopMainEqAnimation();stopMiniEqAnimation()};
    audio.onended=()=>{document.getElementById('fullIcon').classList.remove('playing');stopMainEqAnimation();stopMiniEqAnimation();if(isRepeat){audio.currentTime=0;audio.play()}else playNext()};

    function toggleTheme(){document.body.classList.toggle('light-theme');document.getElementById('themeBtn').innerText=document.body.classList.contains('light-theme')?'☀️':'🌙'}

    // ====== НОВЫЙ ПРЯМОЙ ПОИСК В S3 (без бота) ======
    async function toggleSearchMode(){
        searchMode = searchMode === 'local' ? 'cloud' : 'local';
        const btn = document.getElementById('searchModeBtn');
        btn.textContent = searchMode === 'local' ? '💾 Локально' : '☁️ Облако';
        btn.classList.toggle('active', searchMode === 'local');
        document.getElementById('searchInput').placeholder = searchMode === 'local' ? '🔍 Поиск...' : '☁️ Поиск напрямую в S3...';
        document.getElementById('searchInput').value = '';
        if (searchMode === 'local') { cloudResults = []; renderTracks(); }
        else {
            if (!s3Cache) { await fetchS3ListDirectly(); }
            else { document.getElementById('trackList').innerHTML = `<div class="empty">✅ Облако готово (${s3Cache.length} треков). Введите запрос.</div>`; }
        }
    }

    async function fetchS3ListDirectly() {
        const container = document.getElementById('trackList');
        container.innerHTML = '<div class="empty">⏳ Парсинг корзины Timeweb S3...</div>';
        try {
            const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(BUCKET_URL);
            const response = await fetch(proxyUrl);
            const text = await response.text();
            const parser = new DOMParser();
            const xml = parser.parseFromString(text, "application/xml");
            s3Cache = Array.from(xml.getElementsByTagName("Key"))
                           .map(k => k.textContent)
                           .filter(k => k.match(/\.(mp3|m4a|ogg|mp4)$/i));
            container.innerHTML = `<div class="empty">✅ S3 просканирован. Найдено ${s3Cache.length} файлов. Введите запрос.</div>`;
        } catch (e) {
            console.error(e);
            container.innerHTML = '<div class="empty">❌ Ошибка подключения к Timeweb S3. Проверьте права корзины.</div>';
            s3Cache = null;
        }
    }

    function handleSearchInput(){
        const query = document.getElementById('searchInput').value.toLowerCase();
        if (searchMode === 'local') { renderTracks(query); }
        else if (searchMode === 'cloud') { searchCloudDirect(query); }
    }

    function searchCloudDirect(query) {
        if (!s3Cache) return;
        const container = document.getElementById('trackList');
        if (!query) { container.innerHTML = `<div class="empty">✅ Облако готово (${s3Cache.length} треков). Введите запрос.</div>`; return; }
        cloudResults = [];
        s3Cache.forEach((key, i) => {
            if (key.toLowerCase().includes(query)) {
                let name = key.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
                let artist = "Неизвестен", title = name;
                if (name.includes(" - ")) { const parts = name.split(" - "); artist = parts.shift().trim(); title = parts.join(" - ").trim(); }
                cloudResults.push({
                    id: "cloud_" + i, artist: artist, title: title,
                    file_type: key.toLowerCase().endsWith(".mp4") ? "video" : "audio",
                    url: BUCKET_URL + "/" + key.split('/').map(encodeURIComponent).join('/')
                });
            }
        });
        currentPlaylist = cloudResults;
        renderCloudResults();
    }
    // ====== КОНЕЦ НОВОГО БЛОКА ======

    function buildTagFilters(){const allTags=new Set();allTracks.forEach(t=>{if(t.tags&&Array.isArray(t.tags)){t.tags.forEach(tag=>allTags.add(tag))}});const container=document.getElementById('tagFilters');container.innerHTML='';[...allTags].sort().forEach(tag=>{const btn=document.createElement('button');btn.className='tag-btn';btn.textContent=TAG_ICONS[tag]||tag;btn.title=tag;btn.onclick=()=>filterByTag(tag);container.appendChild(btn)})}
    function switchTab(tab){currentTab=tab;currentTag='all';searchMode='local';document.getElementById('searchModeBtn').textContent='💾 Локально';document.getElementById('searchModeBtn').classList.add('active');document.getElementById('searchInput').placeholder='🔍 Поиск...';cloudResults=[];document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));['all','audio','video','fav'].forEach((t,i)=>{if(tab===t)document.querySelectorAll('.tab')[i].classList.add('active')});document.querySelectorAll('.tag-btn').forEach(b=>b.classList.remove('active'));renderTracks()}
    function filterByTag(tag){currentTag=tag;document.querySelectorAll('.tag-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tag-btn').forEach(b=>{if(b.title===tag)b.classList.add('active')});renderTracks()}
    function loadLocalData(){Promise.all([fetch('https://dmitry3322.github.io/media-player/music_list_github.json').then(r=>r.json()).catch(()=>[]),fetch('https://dmitry3322.github.io/media-player/music_list_cloud.json').then(r=>r.json()).catch(()=>[])]).then(([github,cloud])=>{allTracks=[...github,...cloud];buildTagFilters();renderTracks()}).catch(()=>{document.getElementById('trackList').innerHTML='<div class="empty">Файлы не найдены</div>'})}
    const urlParams=new URLSearchParams(window.location.search),cloudData=urlParams.get('cloud');
    if(cloudData){try{cloudResults=JSON.parse(decodeURIComponent(cloudData));searchMode='cloud';document.getElementById('searchModeBtn').textContent='☁️ Облако';document.getElementById('searchModeBtn').classList.remove('active');currentPlaylist=cloudResults;renderCloudResults()}catch(e){loadLocalData()}}else loadLocalData();

    function renderCloudResults(){const container=document.getElementById('trackList');container.innerHTML=cloudResults.length?'':'<div class="empty">Ничего не найдено</div>';cloudResults.forEach(t=>{const div=document.createElement('div');div.className='track-item';div.setAttribute('data-id',t.id);div.setAttribute('data-url',t.url||'');div.innerHTML=`<input type="checkbox" class="track-checkbox"><div class="track-icon">${t.file_type==='audio'?'🎧':'🎬'}</div><div class="track-info"><div class="track-title">${t.title||'Без названия'}</div><div class="track-artist">${t.artist||'Неизвестен'}</div></div><div class="track-controls"><button class="btn-play" onclick="playCloudTrack('${t.id}','${t.url}');event.stopPropagation();">▶</button></div>`;container.appendChild(div)})}
    function playCloudTrack(id,url){if(!url)return;audio.src=url;audio.play().then(()=>{currentTrackId=id;document.getElementById('miniPlayer').style.display="flex";const track=cloudResults.find(t=>t.id===id);if(track){document.getElementById('miniTitle').innerText=track.title||'';document.getElementById('miniArtist').innerText=track.artist||'';document.getElementById('fullTitle').innerText=track.title||'';document.getElementById('fullArtist').innerText=track.artist||''}setPlayState(true)}).catch(()=>{})}
    function renderTracks(query=''){let filtered=allTracks;if(currentTab==='audio')filtered=filtered.filter(t=>t.file_type==='audio');if(currentTab==='video')filtered=filtered.filter(t=>t.file_type==='video');if(currentTab==='fav')filtered=filtered.filter(t=>favoriteIds.includes(t.id));if(currentTag!=='all')filtered=filtered.filter(t=>t.tags&&t.tags.includes(currentTag));if(query)filtered=filtered.filter(t=>(t.artist+" "+t.title).toLowerCase().includes(query));currentPlaylist=filtered;const container=document.getElementById('trackList');container.innerHTML=filtered.length?'':'<div class="empty">Ничего не найдено</div>';filtered.forEach(t=>{const isLiked=favoriteIds.includes(t.id)?'active':'';const div=document.createElement('div');div.className='track-item';div.setAttribute('data-id',t.id);if(t.id===currentTrackId)div.classList.add('now-playing');div.innerHTML=`<input type="checkbox" class="track-checkbox"><div class="track-icon">${t.file_type==='audio'?'🎧':'🎬'}</div><div class="track-info"><div class="track-title">${t.title||'Без названия'}</div><div class="track-artist">${t.artist||'Неизвестен'}</div></div><div class="track-controls"><span class="heart-icon ${isLiked}" onclick="toggleFavClick(this,${t.id});event.stopPropagation();">♥</span><button class="btn-play ${t.id===currentTrackId&&!audio.paused?'hidden':''}" onclick="startPlay(${t.id});event.stopPropagation();">▶</button><div class="mini-eq ${t.id===currentTrackId&&!audio.paused?'active':''}"><div class="eq-bar" style="height:6px"></div><div class="eq-bar" style="height:10px"></div><div class="eq-bar" style="height:8px"></div></div></div>`;container.appendChild(div)});if(currentTrackId&&!audio.paused){startMiniEqAnimation(currentTrackId);highlightCurrentTrack(currentTrackId)}}
    function startPlay(id){const idx=currentPlaylist.findIndex(t=>t.id===id);if(idx!==-1)attemptPlay(idx)}
    function attemptPlay(index){if(index<0||index>=currentPlaylist.length)return;const track=currentPlaylist[index];stopMiniEqAnimation();currentTrackIndex=index;currentTrackId=track.id;if(!track.url){playNext();return}audio.src=track.url;audio.play().then(()=>{updatePlayerUI(track);document.getElementById('miniPlayer').style.display="flex";highlightCurrentTrack(track.id);startMiniEqAnimation(track.id)}).catch(()=>{playNext()})}
    function updatePlayerUI(track){document.getElementById('miniTitle').innerText=track.title||'';document.getElementById('miniArtist').innerText=track.artist||'';document.getElementById('fullTitle').innerText=track.title||'';document.getElementById('fullArtist').innerText=track.artist||'';document.getElementById('fullIcon').innerText=track.file_type==='audio'?'🎧':'🎬';document.getElementById('fullHeartBtn').classList.toggle('active',favoriteIds.includes(track.id));setPlayState(true)}
    function setPlayState(playing){const miniBtn=document.getElementById('miniPlayBtn'),fullSvg=document.getElementById('fpsvg');if(playing){miniBtn.innerHTML='<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';fullSvg.innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'}else{miniBtn.innerHTML='<svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21 6,3"/></svg>';fullSvg.innerHTML='<polygon points="6,3 20,12 6,21 6,3"/>'}}
    function togglePlay(event){if(event)event.stopPropagation();if(!audio.src)return;audio.paused?audio.play():audio.pause()}
    function playNext(event){if(event)event.stopPropagation();if(!currentPlaylist.length)return;const next=isShuffle?Math.floor(Math.random()*currentPlaylist.length):(currentTrackIndex+1)%currentPlaylist.length;attemptPlay(next)}
    function playPrev(event){if(event)event.stopPropagation();if(!currentPlaylist.length)return;const prev=(currentTrackIndex-1+currentPlaylist.length)%currentPlaylist.length;attemptPlay(prev)}
    function toggleShuffle(){isShuffle=!isShuffle;document.getElementById('shuffleBtn').classList.toggle('active',isShuffle)}
    function toggleRepeat(){isRepeat=!isRepeat;document.getElementById('repeatBtn').classList.toggle('active',isRepeat)}
    function openFullPlayer(event){if(!event.target.closest('.mini-ctrl-btn'))document.getElementById('fullPlayer').classList.add('active')}
    function closeFullPlayer(){document.getElementById('fullPlayer').classList.remove('active')}
    audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;const pct=(audio.currentTime/audio.duration)*100;document.getElementById('miniProgress').style.width=pct+'%';if(!isSeeking){document.getElementById('timeline').value=pct;document.getElementById('timeCurrent').innerText=formatTime(audio.currentTime)}});
    audio.addEventListener('loadedmetadata',()=>{document.getElementById('timeTotal').innerText=formatTime(audio.duration)});
    audio.addEventListener('play',()=>setPlayState(true));audio.addEventListener('pause',()=>setPlayState(false));
    function onTimelineInput(){isSeeking=true}
    function onTimelineChange(){if(!audio.duration)return;audio.currentTime=(document.getElementById('timeline').value/100)*audio.duration;isSeeking=false}
    function formatTime(s){if(isNaN(s))return"0:00";const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}
    function sendSelectedBatch(){const items=document.querySelectorAll('.track-checkbox:checked');let ids=[],urls=[];items.forEach(cb=>{const item=cb.closest('.track-item'),tid=item.getAttribute('data-id'),url=item.getAttribute('data-url');if(url)urls.push(url);else if(tid&&!tid.startsWith('cloud_'))ids.push(parseInt(tid))});if(ids.length||urls.length){tg.sendData(JSON.stringify({action:"play_batch",ids:ids,urls:urls}));tg.close()}}
    function toggleFavClick(el,tid){el.classList.toggle('active');el.classList.contains('active')?favoriteIds.push(tid):favoriteIds=favoriteIds.filter(id=>id!==tid);localStorage.setItem('fav_tracks',JSON.stringify(favoriteIds));if(currentTab==='fav')renderTracks()}
    function toggleFavFromPlayer(){if(currentTrackIndex===-1)return;const track=currentPlaylist[currentTrackIndex],btn=document.getElementById('fullHeartBtn');btn.classList.toggle('active');btn.classList.contains('active')?favoriteIds.push(track.id):favoriteIds=favoriteIds.filter(id=>id!==track.id);localStorage.setItem('fav_tracks',JSON.stringify(favoriteIds));renderTracks()}
</script>
